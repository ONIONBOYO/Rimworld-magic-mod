name: Build

# Compiles the assembly against the RimWorld reference assemblies and validates every XML def against it.
on:
  push:
    branches-ignore: [ci-logs]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compile assembly
        id: compile
        shell: bash
        run: |
          set -o pipefail
          dotnet build Source/ArcanumAscendant/ArcanumAscendant.csproj -c Release -clp:NoSummary 2>&1 | tee build.log

      - name: Validate defs against the assembly
        id: validate
        if: steps.compile.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          REFS=$(ls -d ~/.nuget/packages/krafs.rimworld.ref/*/ref/net472 | tail -1)
          dotnet build Tools/validator/validator.csproj -c Release -v q
          dotnet Tools/validator/bin/Release/net8.0/validator.dll . "$REFS" 2>&1 | tee validate.log

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            1.6/Assemblies/ArcanumAscendant.dll
            build.log
            validate.log

      - name: Publish logs and assembly to the ci-logs branch
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p /tmp/ci && cp build.log /tmp/ci/ 2>/dev/null || true
          cp validate.log /tmp/ci/ 2>/dev/null || true
          cp 1.6/Assemblies/ArcanumAscendant.dll /tmp/ci/ 2>/dev/null || true
          echo "${{ github.sha }} compile=${{ steps.compile.outcome }} validate=${{ steps.validate.outcome }}" > /tmp/ci/status.txt
          cd /tmp/ci && git init -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "CI output for ${{ github.sha }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
